# Include inside your own TLS-enabled server block for mcp.example.com.
# Provision valid TLS separately; retain the Authorization header, never put it in URLs.
location = /vk/mcp {
    proxy_pass http://127.0.0.1:8865/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_read_timeout 600s;
    client_max_body_size 1m;
    access_log off;
    error_log /dev/null emerg;
}
location = /vk/health {
    proxy_pass http://127.0.0.1:8865/health;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    access_log off;
    error_log /dev/null emerg;
}
# Optional registration-only return URL when VK requires one to create an app.
# Does not implement VK ID OAuth, does not accept/exchange/echo code or state.
location = /vk/registration {
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    access_log off;
    error_log /dev/null emerg;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    if ($args != "") { return 400; }
    return 200 "VK MCP application registration. VK sign-in is not enabled on this endpoint.\n";
}
